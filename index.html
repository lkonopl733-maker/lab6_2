<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Авторизація — Самостійна робота</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-container">
      <h2>Вхід до системи</h2>
      <form>
        <div class="auth-group">
          <label>Логін або Email</label>
          <input type="text" placeholder="Введіть логін" required />
        </div>

        <div class="auth-group">
          <label>Пароль</label>
          <input type="password" placeholder="Введіть пароль" required />
        </div>

        <button type="submit" class="auth-submit">Увійти</button>
      </form>
    </div>
  </body>
</html>
